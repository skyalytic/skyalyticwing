# H-I2 fix: 为所有工作负载创建最小权限 ServiceAccount 与 RBAC 绑定。
# 原问题：k8s 全目录无 ServiceAccount/Role/RoleBinding/serviceAccountName，
# 工作负载默认使用 default SA 且自动挂载 SA token，容器被攻破后可利用 token 访问 K8s API。
#
# 修复策略（最小权限原则）：
#   1. 为 gateway 与 db（postgres/redis）各创建专用 SA
#   2. automountServiceAccountToken: false，不挂载 SA token 到 Pod 文件系统，
#      即使容器被攻破也无法直接读取 token 调用 K8s API
#   3. gateway 不需要任何 K8s API 权限（不操作 Pod/Service/ConfigMap 等），
#      故 Role 不授予任何资源权限，仅定义 RoleBinding 占位以便未来按需扩展
#   4. db SA 同样无需 K8s API 权限
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skyalyticwing
  namespace: default
  labels:
    app: skyalyticwing
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skyalyticwing-db
  namespace: default
  labels:
    app: skyalyticwing
automountServiceAccountToken: false
---
# H-I2 fix: Role 不授予任何资源权限（gateway/db 无需访问 K8s API）。
# 明确定义空权限 Role，避免未来误用 default SA 的隐式权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skyalyticwing-gateway
  namespace: default
  labels:
    app: skyalyticwing
rules: []
---
# H-I2 fix: 将 gateway SA 绑定到空权限 Role，显式声明无 K8s API 访问权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skyalyticwing-gateway
  namespace: default
  labels:
    app: skyalyticwing
subjects:
  - kind: ServiceAccount
    name: skyalyticwing
    namespace: default
roleRef:
  kind: Role
  name: skyalyticwing-gateway
  apiGroup: rbac.authorization.k8s.io
