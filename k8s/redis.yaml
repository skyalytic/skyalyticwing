apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # C-D4 fix: Pod 级 securityContext，强制非 root 运行。
      # redis:7-alpine 默认以 UID 999 的 redis 用户运行，runAsNonRoot 兼容该用户。
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
      # H-I2 fix: 使用最小权限 ServiceAccount，不挂载 SA token。SA 定义见 k8s/rbac.yaml。
      serviceAccountName: skyalyticwing-db
      containers:
      - name: redis
        image: redis:7-alpine
        # C-D4 fix: Container 级 securityContext，丢弃所有 Linux capabilities 并禁止提权。
        # 注：redis 需写 /data 与 /tmp，故不启用 readOnlyRootFilesystem。
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 6379
        # M-I1 fix: 添加 resources.requests 和 resources.limits，
        # 避免单个 Pod 占用过多节点资源导致集群不稳定。
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
