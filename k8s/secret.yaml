apiVersion: v1
kind: Secret
metadata:
  name: skyalyticwing-secrets
type: Opaque
# C-D1 fix: 移除明文硬编码凭据。所有 key 使用空占位字符串，
# 真实值应通过 kubectl create secret 或 SealedSecrets/External Secrets Operator 注入：
#   kubectl create secret generic skyalyticwing-secrets \
#     --from-literal=database-url='postgresql://USER:PASS@postgres:5432/skyalyticwing' \
#     --from-literal=database-password='...' \
#     --from-literal=redis-url='redis://redis:6379' \
#     --from-literal=anthropic-api-key='...' \
#     --from-literal=openai-api-key='...'
# 同时建议从 git 历史中清除旧凭据 (git filter-repo)。
# C-D2 fix: 新增 database-password 键，与 postgres.yaml:25-29 的 secretKeyRef.key 一致。
# L-I2 fix: 改用 data: 而非 stringData:。
# stringData 在 git 中易被误识别为可读配置（明文显示），data 要求 base64 编码，
# 在 git 中显示为不可读字符串，减少误操作风险。两者在 etcd 中均为明文存储，
# 但 data 强制 base64 提供了一层"非明文"的视觉提示。
# 空字符串的 base64 编码仍是空字符串，所以占位符为空。
# 部署时必须用真实值替换：echo -n 'value' | base64
data:
  database-url: ""
  database-password: ""
  redis-url: ""
  anthropic-api-key: ""
  openai-api-key: ""
