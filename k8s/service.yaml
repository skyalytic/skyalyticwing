apiVersion: v1
kind: Service
metadata:
  name: skyalyticwing
  labels:
    app: skyalyticwing
spec:
  type: ClusterIP
  ports:
  - port: 18789
    targetPort: 18789
    protocol: TCP
    name: gateway
  selector:
    app: skyalyticwing
---
# C-D3 fix: 为 postgres 添加 ClusterIP Service，使 DNS postgres:5432 可解析。
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres
---
# C-D3 fix: 为 redis 添加 ClusterIP Service，使 DNS redis:6379 可解析。
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis
