server {
    listen 80;
    listen 443 ssl;
    server_name skyalytic.com;

    ssl_certificate /etc/nginx/ssl/skyalytic.com.crt;
    ssl_certificate_key /etc/nginx/ssl/skyalytic.com.key;

    root /var/www/skyalytic.com;

    location /updates/ {
        alias /var/www/skyalytic.com/updates/;
        autoindex off;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /updates/latest.json {
        alias /var/www/skyalytic.com/updates/latest.json;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* /updates/.*\.(exe|dmg|AppImage|deb|msi)$ {
        alias /var/www/skyalytic.com/updates/;
        add_header Content-Type application/octet-stream;
        add_header Content-Disposition 'attachment';
    }
}
