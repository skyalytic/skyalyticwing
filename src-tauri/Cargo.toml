[package]
license = "PolyForm-Noncommercial-1.0.0"
name = "skyalyticwing"
version = "2.1.0"
description = "SkyalyticWing - Enterprise-grade Personal AI Assistant"
authors = ["SkyalyticWing Team"]
edition = "2021"

[features]
# A direct `cargo build --release` must use embedded assets too. Without this,
# Tauri resolves the initial App URL against devUrl before the sidecar is ready.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "skyalyticwing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
log = "0.4"
tauri-plugin-log = "2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38.2"
windows = "0.61.3"

[target.'cfg(target_os = "macos")'.dependencies]
sha2 = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
